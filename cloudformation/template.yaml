AWSTemplateFormatVersion: '2010-09-09'

Description: 'Nested CloudFormation template that creates a set of subnets in an existing VPC. Public subnets share one route table with a default route to an Internet Gateway. Application subnets share one route table with a default route to a NAT gateway, or get one route table and NAT gateway per AZ when NatGatewayHighlyAvailable is true'

Metadata:
  cfn-lint:
    config:
      # VpcId and NatPublicSubnetIds default to "" and are only used when the
      # VpcIdRequiredWithoutCiSuffix and NatPublicSubnetIdsRequiredForApplication
      # rules force a valid value. cfn-lint cannot see those guards, so it reports
      # the empty defaults as invalid IDs (W1030 for VPC IDs, W1035 for subnet IDs).
      ignore_checks:
        - W1030
        - W1035

Parameters:
  VpcId:
    Type: String
    Default: ""
    Description: "ID of the existing VPC to create the subnets in. Required when CiSuffix is empty; must be empty when CiSuffix is set (a VPC is created instead)"
    AllowedPattern: "^(vpc-([0-9a-f]{8}|[0-9a-f]{17}))?$"
    ConstraintDescription: "Must be empty or a valid VPC ID, e.g. vpc-0123abcd"

  VpcName:
    Type: String
    Description: "Value of the VPC Name tag, used as the prefix for the route table name"
    MinLength: 1

  AvailabilityZones:
    Type: CommaDelimitedList
    Default: "us-east-1a,us-east-1b"
    Description: "Comma-separated list of Availability Zones, one per subnet (e.g. us-east-1a,us-east-1b)"

  SubnetCidrBlocks:
    Type: CommaDelimitedList
    Default: "10.0.1.0/24,10.0.2.0/24"
    Description: "Comma-separated list of IP ranges (CIDRs), one per subnet, in the same order as AvailabilityZones"

  SubnetCount:
    Type: Number
    Default: 2
    Description: "Number of subnets to create (1-6). Must be less than or equal to the number of AZs and CIDRs provided"
    AllowedValues: [1, 2, 3, 4, 5, 6]

  SubnetQualifier:
    Type: String
    Description: "Subnet qualifier. 'public' adds a default route to the Internet Gateway; 'application' adds a default route to a NAT gateway"
    AllowedValues:
      - public
      - application
      - database
    ConstraintDescription: "Subnet qualifier must be one of: public, application, database"

  InternetGatewayId:
    Type: String
    Default: ""
    Description: "ID of the Internet Gateway attached to the VPC. Required when SubnetQualifier is public"
    AllowedPattern: "^(igw-([0-9a-f]{8}|[0-9a-f]{17}))?$"
    ConstraintDescription: "Must be empty or a valid Internet Gateway ID, e.g. igw-0123abcd"

  CiSuffix:
    Type: String
    Default: ""
    Description: "Optional suffix for CI/CD deployments so that stacks can be deployed uniquely. Leave empty outside CI"
    MaxLength: 20
    AllowedPattern: "^[a-z0-9-]*$"
    ConstraintDescription: "CiSuffix must be empty or lowercase letters, numbers, and hyphens only"

  CiVpcCidrBlock:
    Type: String
    Default: "10.0.0.0/16"
    Description: "CIDR block of the VPC created when CiSuffix is set"
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/(1[6-9]|2[0-8])$"
    ConstraintDescription: "Must be a valid IPv4 CIDR block between /16 and /28"

  NatGatewayHighlyAvailable:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Only used when SubnetQualifier is application. 'false' creates one NAT gateway in the first public subnet and routes all subnets through it. 'true' creates one NAT gateway per AZ, each with its own route table"

  NatPublicSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: "Comma-separated IDs of existing public subnets to host the NAT gateways. Required when SubnetQualifier is application. In HA mode, list one per subnet in the same order as AvailabilityZones"

Conditions:
  IsPublic: !Equals [!Ref SubnetQualifier, public]
  IsApplication: !Equals [!Ref SubnetQualifier, application]

  HasCiSuffix: !Not [!Equals [!Ref CiSuffix, '']]
  IsPublicCi: !And [!Condition IsPublic, !Condition HasCiSuffix]
  IsPublicExisting: !And [!Condition IsPublic, !Not [!Condition HasCiSuffix]]

  IsNatHighlyAvailable: !Equals [!Ref NatGatewayHighlyAvailable, 'true']
  AppSingleNat: !And [!Condition IsApplication, !Not [!Condition IsNatHighlyAvailable]]
  AppHighlyAvailableNat: !And [!Condition IsApplication, !Condition IsNatHighlyAvailable]
  UseSharedRouteTable: !Not [!Condition AppHighlyAvailableNat]

  CreateSubnet1: !Or
    - !Equals [!Ref SubnetCount, '1']
    - !Equals [!Ref SubnetCount, '2']
    - !Equals [!Ref SubnetCount, '3']
    - !Equals [!Ref SubnetCount, '4']
    - !Equals [!Ref SubnetCount, '5']
    - !Equals [!Ref SubnetCount, '6']
  CreateSubnet2: !Or
    - !Equals [!Ref SubnetCount, '2']
    - !Equals [!Ref SubnetCount, '3']
    - !Equals [!Ref SubnetCount, '4']
    - !Equals [!Ref SubnetCount, '5']
    - !Equals [!Ref SubnetCount, '6']
  CreateSubnet3: !Or
    - !Equals [!Ref SubnetCount, '3']
    - !Equals [!Ref SubnetCount, '4']
    - !Equals [!Ref SubnetCount, '5']
    - !Equals [!Ref SubnetCount, '6']
  CreateSubnet4: !Or
    - !Equals [!Ref SubnetCount, '4']
    - !Equals [!Ref SubnetCount, '5']
    - !Equals [!Ref SubnetCount, '6']
  CreateSubnet5: !Or
    - !Equals [!Ref SubnetCount, '5']
    - !Equals [!Ref SubnetCount, '6']
  CreateSubnet6: !Equals [!Ref SubnetCount, '6']

  AzNat1: !And [!Condition AppHighlyAvailableNat, !Condition CreateSubnet1]
  AzNat2: !And [!Condition AppHighlyAvailableNat, !Condition CreateSubnet2]
  AzNat3: !And [!Condition AppHighlyAvailableNat, !Condition CreateSubnet3]
  AzNat4: !And [!Condition AppHighlyAvailableNat, !Condition CreateSubnet4]
  AzNat5: !And [!Condition AppHighlyAvailableNat, !Condition CreateSubnet5]
  AzNat6: !And [!Condition AppHighlyAvailableNat, !Condition CreateSubnet6]

Rules:
  VpcIdRequiredWithoutCiSuffix:
    RuleCondition: !Equals [!Ref CiSuffix, '']
    Assertions:
      - Assert: !Not [!Equals [!Ref VpcId, '']]
        AssertDescription: "VpcId is required when CiSuffix is empty"

  VpcIdNotAllowedWithCiSuffix:
    RuleCondition: !Not [!Equals [!Ref CiSuffix, '']]
    Assertions:
      - Assert: !Equals [!Ref VpcId, '']
        AssertDescription: "VpcId must be empty when CiSuffix is set, because a VPC is created for CI"

  NatPublicSubnetIdsRequiredForApplication:
    RuleCondition: !Equals [!Ref SubnetQualifier, application]
    Assertions:
      - Assert: !Not [!Contains [!Ref NatPublicSubnetIds, '']]
        AssertDescription: "NatPublicSubnetIds must list existing public subnet IDs when SubnetQualifier is application"

Resources:
  # ---------- CI-only VPC, Internet Gateway and attachment ----------
  CiVpc:
    Type: AWS::EC2::VPC
    Condition: HasCiSuffix
    Properties:
      CidrBlock: !Ref CiVpcCidrBlock
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Ref CiSuffix]]

  CiInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: HasCiSuffix
    Properties:
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Ref CiSuffix]]

  CiGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: HasCiSuffix
    Properties:
      VpcId: !Ref CiVpc
      InternetGatewayId: !Ref CiInternetGateway

  # ---------- Shared route table (created first) ----------
  # Used by public subnets, and by application subnets when NatGatewayHighlyAvailable is false
  RouteTable:
    Type: AWS::EC2::RouteTable
    Condition: UseSharedRouteTable
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !If [IsPublic, !Ref SubnetQualifier, !Sub "${SubnetQualifier}-pvt"], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  # Default route to the CI-created Internet Gateway (waits for it to be attached)
  PublicRouteCi:
    Type: AWS::EC2::Route
    Condition: IsPublicCi
    DependsOn: CiGatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref CiInternetGateway

  # Default route to the existing Internet Gateway supplied by InternetGatewayId
  PublicRoute:
    Type: AWS::EC2::Route
    Condition: IsPublicExisting
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  # ---------- Single NAT gateway (application, NatGatewayHighlyAvailable=false) ----------
  NatEip:
    Type: AWS::EC2::EIP
    Condition: AppSingleNat
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat']]

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: AppSingleNat
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Select [0, !Ref NatPublicSubnetIds]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat']]

  NatRoute:
    Type: AWS::EC2::Route
    Condition: AppSingleNat
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # ---------- Subnet 1 ----------
  Subnet1:
    Type: AWS::EC2::Subnet
    Condition: CreateSubnet1
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      CidrBlock: !Select [0, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Select [0, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !If [IsPublic, !Ref SubnetQualifier, !Sub "${SubnetQualifier}-pvt"], !Select [0, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  RouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateSubnet1
    Properties:
      SubnetId: !Ref Subnet1
      RouteTableId: !If [UseSharedRouteTable, !Ref RouteTable, !Ref AzRouteTable1]

  # ---------- Subnet 2 ----------
  Subnet2:
    Type: AWS::EC2::Subnet
    Condition: CreateSubnet2
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      CidrBlock: !Select [1, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Select [1, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !If [IsPublic, !Ref SubnetQualifier, !Sub "${SubnetQualifier}-pvt"], !Select [1, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  RouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateSubnet2
    Properties:
      SubnetId: !Ref Subnet2
      RouteTableId: !If [UseSharedRouteTable, !Ref RouteTable, !Ref AzRouteTable2]

  # ---------- Subnet 3 ----------
  Subnet3:
    Type: AWS::EC2::Subnet
    Condition: CreateSubnet3
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      CidrBlock: !Select [2, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Select [2, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !If [IsPublic, !Ref SubnetQualifier, !Sub "${SubnetQualifier}-pvt"], !Select [2, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  RouteTableAssociation3:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateSubnet3
    Properties:
      SubnetId: !Ref Subnet3
      RouteTableId: !If [UseSharedRouteTable, !Ref RouteTable, !Ref AzRouteTable3]

  # ---------- Subnet 4 ----------
  Subnet4:
    Type: AWS::EC2::Subnet
    Condition: CreateSubnet4
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      CidrBlock: !Select [3, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Select [3, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !If [IsPublic, !Ref SubnetQualifier, !Sub "${SubnetQualifier}-pvt"], !Select [3, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  RouteTableAssociation4:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateSubnet4
    Properties:
      SubnetId: !Ref Subnet4
      RouteTableId: !If [UseSharedRouteTable, !Ref RouteTable, !Ref AzRouteTable4]

  # ---------- Subnet 5 ----------
  Subnet5:
    Type: AWS::EC2::Subnet
    Condition: CreateSubnet5
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      CidrBlock: !Select [4, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Select [4, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !If [IsPublic, !Ref SubnetQualifier, !Sub "${SubnetQualifier}-pvt"], !Select [4, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  RouteTableAssociation5:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateSubnet5
    Properties:
      SubnetId: !Ref Subnet5
      RouteTableId: !If [UseSharedRouteTable, !Ref RouteTable, !Ref AzRouteTable5]

  # ---------- Subnet 6 ----------
  Subnet6:
    Type: AWS::EC2::Subnet
    Condition: CreateSubnet6
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      CidrBlock: !Select [5, !Ref SubnetCidrBlocks]
      AvailabilityZone: !Select [5, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: !If [IsPublic, true, false]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !If [IsPublic, !Ref SubnetQualifier, !Sub "${SubnetQualifier}-pvt"], !Select [5, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  RouteTableAssociation6:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: CreateSubnet6
    Properties:
      SubnetId: !Ref Subnet6
      RouteTableId: !If [UseSharedRouteTable, !Ref RouteTable, !Ref AzRouteTable6]

  # ---------- Per-AZ NAT gateways and route tables (application, NatGatewayHighlyAvailable=true) ----------
  AzEip1:
    Type: AWS::EC2::EIP
    Condition: AzNat1
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '1']]

  AzNatGateway1:
    Type: AWS::EC2::NatGateway
    Condition: AzNat1
    Properties:
      AllocationId: !GetAtt AzEip1.AllocationId
      SubnetId: !Select [0, !Ref NatPublicSubnetIds]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '1']]

  AzRouteTable1:
    Type: AWS::EC2::RouteTable
    Condition: AzNat1
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", !Select [0, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  AzDefaultRoute1:
    Type: AWS::EC2::Route
    Condition: AzNat1
    Properties:
      RouteTableId: !Ref AzRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref AzNatGateway1

  AzEip2:
    Type: AWS::EC2::EIP
    Condition: AzNat2
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '2']]

  AzNatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: AzNat2
    Properties:
      AllocationId: !GetAtt AzEip2.AllocationId
      SubnetId: !Select [1, !Ref NatPublicSubnetIds]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '2']]

  AzRouteTable2:
    Type: AWS::EC2::RouteTable
    Condition: AzNat2
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", !Select [1, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  AzDefaultRoute2:
    Type: AWS::EC2::Route
    Condition: AzNat2
    Properties:
      RouteTableId: !Ref AzRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref AzNatGateway2

  AzEip3:
    Type: AWS::EC2::EIP
    Condition: AzNat3
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '3']]

  AzNatGateway3:
    Type: AWS::EC2::NatGateway
    Condition: AzNat3
    Properties:
      AllocationId: !GetAtt AzEip3.AllocationId
      SubnetId: !Select [2, !Ref NatPublicSubnetIds]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '3']]

  AzRouteTable3:
    Type: AWS::EC2::RouteTable
    Condition: AzNat3
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", !Select [2, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  AzDefaultRoute3:
    Type: AWS::EC2::Route
    Condition: AzNat3
    Properties:
      RouteTableId: !Ref AzRouteTable3
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref AzNatGateway3

  AzEip4:
    Type: AWS::EC2::EIP
    Condition: AzNat4
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '4']]

  AzNatGateway4:
    Type: AWS::EC2::NatGateway
    Condition: AzNat4
    Properties:
      AllocationId: !GetAtt AzEip4.AllocationId
      SubnetId: !Select [3, !Ref NatPublicSubnetIds]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '4']]

  AzRouteTable4:
    Type: AWS::EC2::RouteTable
    Condition: AzNat4
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", !Select [3, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  AzDefaultRoute4:
    Type: AWS::EC2::Route
    Condition: AzNat4
    Properties:
      RouteTableId: !Ref AzRouteTable4
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref AzNatGateway4

  AzEip5:
    Type: AWS::EC2::EIP
    Condition: AzNat5
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '5']]

  AzNatGateway5:
    Type: AWS::EC2::NatGateway
    Condition: AzNat5
    Properties:
      AllocationId: !GetAtt AzEip5.AllocationId
      SubnetId: !Select [4, !Ref NatPublicSubnetIds]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '5']]

  AzRouteTable5:
    Type: AWS::EC2::RouteTable
    Condition: AzNat5
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", !Select [4, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  AzDefaultRoute5:
    Type: AWS::EC2::Route
    Condition: AzNat5
    Properties:
      RouteTableId: !Ref AzRouteTable5
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref AzNatGateway5

  AzEip6:
    Type: AWS::EC2::EIP
    Condition: AzNat6
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '6']]

  AzNatGateway6:
    Type: AWS::EC2::NatGateway
    Condition: AzNat6
    Properties:
      AllocationId: !GetAtt AzEip6.AllocationId
      SubnetId: !Select [5, !Ref NatPublicSubnetIds]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", 'nat', '6']]

  AzRouteTable6:
    Type: AWS::EC2::RouteTable
    Condition: AzNat6
    Properties:
      VpcId: !If [HasCiSuffix, !Ref CiVpc, !Ref VpcId]
      Tags:
        - Key: Name
          Value: !Join ['-', [!Ref VpcName, !Sub "${SubnetQualifier}-pvt", !Select [5, !Ref AvailabilityZones], !If [HasCiSuffix, !Ref CiSuffix, !Ref AWS::NoValue]]]

  AzDefaultRoute6:
    Type: AWS::EC2::Route
    Condition: AzNat6
    Properties:
      RouteTableId: !Ref AzRouteTable6
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref AzNatGateway6

Outputs:
  SubnetId1:
    Condition: CreateSubnet1
    Description: "ID of subnet 1"
    Value: !Ref Subnet1
    Export:
      Name: !Sub "${AWS::StackName}-SubnetId1"
  SubnetId2:
    Condition: CreateSubnet2
    Description: "ID of subnet 2"
    Value: !Ref Subnet2
    Export:
      Name: !Sub "${AWS::StackName}-SubnetId2"
  SubnetId3:
    Condition: CreateSubnet3
    Description: "ID of subnet 3"
    Value: !Ref Subnet3
    Export:
      Name: !Sub "${AWS::StackName}-SubnetId3"
  SubnetId4:
    Condition: CreateSubnet4
    Description: "ID of subnet 4"
    Value: !Ref Subnet4
    Export:
      Name: !Sub "${AWS::StackName}-SubnetId4"
  SubnetId5:
    Condition: CreateSubnet5
    Description: "ID of subnet 5"
    Value: !Ref Subnet5
    Export:
      Name: !Sub "${AWS::StackName}-SubnetId5"
  SubnetId6:
    Condition: CreateSubnet6
    Description: "ID of subnet 6"
    Value: !Ref Subnet6
    Export:
      Name: !Sub "${AWS::StackName}-SubnetId6"

  RouteTableId:
    Condition: UseSharedRouteTable
    Description: "ID of the route table shared by all subnets"
    Value: !Ref RouteTable
    Export:
      Name: !Sub "${AWS::StackName}-RouteTableId"
